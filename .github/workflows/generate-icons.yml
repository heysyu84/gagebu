name: Generate ledger favicon assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'favicon.svg'
      - 'scripts/generate-icons.py'
      - '.github/workflows/generate-icons.yml'

permissions:
  contents: write

concurrency:
  group: ledger-favicon-assets
  cancel-in-progress: false

jobs:
  generate-icons:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vector renderer
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Render iOS Android and browser assets
        run: python scripts/generate-icons.py
      - name: Commit images to the source repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh generated browser and mobile icons"
            git push origin HEAD:main
          fi
