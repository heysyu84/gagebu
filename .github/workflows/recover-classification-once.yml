name: Recover recent accidental classification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-classification-once.yml']
permissions:
  contents: read
concurrency:
  group: ledger-classification-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      LEDGER_PASSWORD: ${{ secrets.STORE_LEDGER_ADMIN_PASSWORD }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Compare saved versions and recover one isolated classification change
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          const base='https://store-ledger-private-api.heysyu84.workers.dev',marker='recovery-classification-20261103-712e492a';
          let token='';
          async function api(path,method='GET',body){
            const response=await fetch(base+path,{method,signal:AbortSignal.timeout(15000),headers:{...(token?{Authorization:'Bearer '+token}:{}),...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});
            if(!response.ok)throw Error('Ledger request failed: '+response.status);
            return response.json();
          }
          async function query(sql,params=[]){
            const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database/7010b43d-5c16-436f-9375-74ee5c127228/query';
            const response=await fetch(url,{method:'POST',signal:AbortSignal.timeout(15000),headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql,params})});
            if(!response.ok)throw Error('D1 read failed: '+response.status);
            const body=await response.json();if(!body.success||!body.result?.[0]?.success)throw Error('D1 read failed');
            return body.result[0].results;
          }
          async function readSaved(version){
            const [row]=await query('SELECT version,revision,chunk_count,updated_at FROM ledger_document_history WHERE ledger_key=? AND version=?',['main-v2',version]);
            if(!row)throw Error('Retained version unavailable');
            const parts=await query('SELECT part,content FROM ledger_document_chunks WHERE ledger_key=? AND revision=? ORDER BY part',['main-v2',row.revision]);
            if(parts.length!==row.chunk_count)throw Error('Incomplete saved version');
            return {version:row.version,updatedAt:row.updated_at,data:JSON.parse(parts.map(x=>x.content).join(''))};
          }
          const own=(x,k)=>Object.prototype.hasOwnProperty.call(x,k),same=(a,b,k)=>own(a,k)===own(b,k)&&JSON.stringify(a[k])===JSON.stringify(b[k]);
          const core=['scope','ledgerType','category','subcategory','status'],allowed=[...core,'manual','confidence','reason','ruleId','detailSubcategory','scopeBeforeExclusion'];
          try{
            token=(await api('/api/login','POST',{password:process.env.LEDGER_PASSWORD})).token;
            const versions=await query('SELECT version,updated_at AS updatedAt FROM ledger_document_history WHERE ledger_key=? ORDER BY version DESC LIMIT 10',['main-v2']);
            versions.sort((a,b)=>b.version-a.version);
            const snapshots=await Promise.all(versions.map(x=>readSaved(x.version))),current=snapshots[0];
            const active=await api('/api/v2/state');
            if(!current||active.version!==current.version||JSON.stringify(active.data)!==JSON.stringify(current.data))throw Error('Saved versions differ; no changes made');
            const next=structuredClone(current.data),history=next.classificationHistory||[],inverse=history.find(x=>x.id===marker+'-undo');
            const at=new Date().toISOString(),correctionId=marker+'-correct-normal-transaction';
            let corrected=false,correction='not_found';
            const newEntries=[],candidates=[];
            if(inverse){
              const row=next.records.find(x=>x.id===inverse.recordId);
              if(row&&inverse.fields.every(k=>same(row,inverse.after,k))&&!history.some(x=>x.id===correctionId)){
                for(const k of inverse.fields){if(own(inverse.before,k))row[k]=inverse.before[k];else delete row[k];}
                inverse.undoneAt=at;
                const original=history.find(x=>x.id===marker);if(original)delete original.undoneAt;
                newEntries.push({...inverse,id:correctionId,at,source:'local',before:inverse.after,after:inverse.before,undoneAt:undefined});
                corrected=true;correction='restored_normal_classification';
              }else correction=row&&inverse.fields.every(k=>same(row,inverse.before,k))?'already_correct':'changed_since_recovery';
            }
            const wanted=new Set(['3b6eb4f009e9858bca512e18e97cc9b73c85b4aefdf55d82e53f3d065fa6b26a','c983055ac5c3af7db941e1f5770e1635925e81ee4aefd17ea92be1fb59521941']);
            for(let i=0;i<snapshots.length-1;i++){
              const latest=snapshots[i],previous=snapshots[i+1],old=new Map(previous.data.records.map(x=>[x.id,x]));
              const queue=previous.data.records.filter(x=>x.direction==='expense'&&x.status==='review').sort((a,b)=>b.date.localeCompare(a.date));
              for(const row of latest.data.records){
                const hash=createHash('sha256').update(row.id).digest('hex'),before=old.get(row.id);
                if(!wanted.has(hash)||!before||!core.some(k=>!same(before,row,k)))continue;
                const fields=[...new Set([...Object.keys(before),...Object.keys(row)])].filter(k=>!same(before,row,k));
                if(!fields.every(k=>allowed.includes(k)))continue;
                const a={},b={};for(const k of fields){if(own(before,k))a[k]=before[k];if(own(row,k))b[k]=row[k];}
                const id='may-candidate-v'+latest.version+'-'+hash;
                const existing=next.records.find(x=>x.id===row.id),canUndo=!!existing&&fields.every(k=>same(existing,b,k));
                if(!history.some(x=>x.id===id))newEntries.push({id,recordId:row.id,date:row.date,merchant:row.merchant||'',amount:row.amount,at:latest.updatedAt,source:'서버 저장본 비교',fields,before:a,after:b});
                candidates.push({hash,eventVersion:latest.version,previousVersion:previous.version,canUndo,reviewCount:queue.length,reviewPosition:queue.findIndex(x=>x.id===row.id)+1,queueHashes:queue.map(x=>createHash('sha256').update(x.id).digest('hex')),scopeBefore:before.scope,scopeAfter:row.scope,statusBefore:before.status,statusAfter:row.status});
              }
            }
            let versionAfter=current.version;
            if(newEntries.length){
              next.classificationHistory=[...newEntries,...history].slice(0,100);
              const saved=await api('/api/v2/state','PUT',{version:current.version,data:next});
              const verified=await api('/api/v2/state');
              if(verified.version!==saved.version||JSON.stringify(verified.data)!==JSON.stringify(next))throw Error('Read-back verification failed');
              versionAfter=saved.version;
            }
            console.log('CORRECTION_RESULT '+JSON.stringify({corrected,correction,versionBefore:current.version,versionAfter,mayCandidates:candidates,mayTransactionsChanged:0}));
          }finally{if(token)await api('/api/logout','POST',{}).catch(()=>{});}
          JS
