<dialog class="editor" id="editor" aria-labelledby="editor-title">
  <div class="editor-head"><h2 id="editor-title">거래 수정</h2><button class="editor-close" id="close-editor" type="button" aria-label="닫기">×</button></div>
  <form class="editor-form" id="editor-form">
    <div class="editor-grid">
      <div class="field"><label for="edit-date">날짜</label><input id="edit-date" name="date" type="date" required></div>
      <div class="field amount-field"><label for="edit-amount">금액 (원)</label><input id="edit-amount" name="amount" type="text" inputmode="numeric" placeholder="0" required></div>
      <div class="field full"><label for="edit-merchant">거래처 / 받는 곳</label><input id="edit-merchant" name="merchant" type="text" placeholder="거래처 입력 또는 선택" list="editor-merchant-options" maxlength="500" required><datalist id="editor-merchant-options"></datalist></div>
      <div class="field"><label for="edit-scope">사용처</label><select id="edit-scope" name="scope"><option value="personal">개인</option><option value="business">편의점</option><option value="windmoon">풍월관</option></select></div>
      <div class="field entry-hint"><span>날짜·금액·거래처만으로 저장할 수 있습니다.</span></div>
      <details class="entry-details" id="editor-details"><summary>분류 · 결제수단 · 메모 <span>선택</span></summary><div class="editor-grid">
      <div class="field"><label for="edit-group">지출 종류</label><select id="edit-group" name="ledgerType"><option value="consumption">소비지출</option><option value="fixed">고정지출</option></select></div>
      <div class="field"><label for="edit-category">대분류</label><input id="edit-category" name="category" maxlength="80" list="editor-major-options" autocomplete="off" placeholder="대분류 선택·검색·새 이름 입력"><datalist id="editor-major-options"></datalist></div>
      <div class="field"><label for="edit-subcategory">소분류</label><input id="edit-subcategory" name="subcategory" maxlength="80" list="editor-minor-options" autocomplete="off" placeholder="소분류 선택·검색·새 이름 입력"><datalist id="editor-minor-options"></datalist></div>
      <div class="field full"><label for="edit-payment">뱅샐 등록 카드 / 원본 결제수단</label><input id="edit-payment" name="payment" maxlength="100" list="editor-payment-options" autocomplete="off" placeholder="결제수단 선택 또는 입력"><datalist id="editor-payment-options"></datalist></div>
      <div class="field full"><label class="onnuri-choice editor-onnuri"><input type="checkbox" id="edit-onnuri" name="onnuri" value="1"> <span>카드로 표시됐지만 실제로는 온누리상품권 잔액으로 결제</span></label><small id="editor-registered-card" class="editor-card-hint"></small></div>
      <div class="field full"><label for="edit-note">메모</label><textarea id="edit-note" name="note" maxlength="20000" placeholder="선택 · 결제 목적 등을 기록"></textarea></div>
      </div></details>
    </div>
    <div class="editor-actions"><button type="button" id="editor-exclude-record" class="btn subtle" hidden>집계 제외</button><button type="button" id="editor-delete-record" class="btn danger-outline" data-delete-record="" hidden>삭제</button><button class="btn" type="button" id="close-editor-secondary">취소</button><button class="btn primary" id="editor-save" type="submit">거래 저장</button></div>
  </form>
</dialog>
<dialog class="editor refund-editor" id="refund-editor" aria-labelledby="refund-editor-title">
  <div class="editor-head"><h2 id="refund-editor-title">환불 연결 관리</h2><button class="editor-close" id="close-refund-editor" type="button" aria-label="환불 관리 닫기">×</button></div>
  <div id="refund-editor-body"></div>
</dialog>
